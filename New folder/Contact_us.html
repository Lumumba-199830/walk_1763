Contact: <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/styled.css">
</head>
<body>
    <div class="form-box">
        <h1>📩 Contact Us</h1>

        <div class="field">
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" placeholder="Your full name">
        </div>

        <div class="field">
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>

        <div class="field">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="+254 700 000 000">
        </div>

        <div class="field">
            <label for="subject">Subject Line:</label>
            <input type="text" id="subject" placeholder="What's this about?">
        </div>

        <div class="field">
            <label for="message">Message:</label>
            <textarea id="message" placeholder="Write your message here…"></textarea>
        </div>

        <button type="button" onclick="sendMessage()">Send Message</button>

        <div class="links">
            <p>Go back to <a href="index.html">Sign In</a> or <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script>
        function sendMessage() {
            const name = document.getElementById('fname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            if (!name || !email || !phone || !subject || !message) {
                alert("Please fill in all fields!");
                return;
            }

            alert("Thank you " + name + "! Your message has been sent successfully ✅");
            document.getElementById('fname').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('subject').value = '';
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
